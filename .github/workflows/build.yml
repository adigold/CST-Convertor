name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: ./build.sh
      - name: Zip app
        run: ditto -c -k --keepParent "dist/CST to Patch.app" "dist/CST-to-Patch.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: CST-to-Patch
          path: dist/CST-to-Patch.zip
      # When you publish a release on GitHub, the app zip is attached to it automatically.
      - name: Attach app to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/CST-to-Patch.zip --clobber
