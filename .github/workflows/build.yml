name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: ./build.sh
      - name: Zip app
        run: ditto -c -k --keepParent "dist/CST to Patch.app" "dist/CST-to-Patch-unsigned.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: CST-to-Patch-unsigned
          path: dist/CST-to-Patch-unsigned.zip
